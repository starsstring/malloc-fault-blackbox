name: Linux build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [gcc, clang, gcc-sanitizers]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify published file hashes
        run: sha256sum -c MANIFEST.sha256
      - name: GCC build and behavior checks
        if: matrix.mode == 'gcc'
        run: make test CC=gcc
      - name: Clang build and behavior checks
        if: matrix.mode == 'clang'
        run: make test CC=clang
      - name: Address and undefined behavior diagnostics
        if: matrix.mode == 'gcc-sanitizers'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make sanitize CC=gcc
